<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prochaine station : l'anglais</title>
<style>
:root{
  --ink:#000; --paper:#ECEDE8; --paper2:#DFE1DA; --muted:#5b5e63;
  --red:#EE352E; --green:#00933C; --blue:#0039A6; --orange:#FF6319; --yellow:#FCCC0A;
  --purple:#B933AD; --lime:#6CBE45; --teal:#00A1DE; --brown:#996633;
  --font:"Helvetica Neue", Helvetica, Arial, sans-serif;
  --pillH:38px; --gap:clamp(56px,17vw,230px); --lv:#00933C;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{min-height:100vh}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select{font-family:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
h1,h2,h3{margin:0}

/* ---------- bandeau façon signalétique ---------- */
.band{background:var(--ink);color:#fff;display:flex;align-items:center;gap:14px;padding:10px clamp(12px,3vw,28px);min-height:64px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.logo{display:flex;align-items:center}
.logo .bullet{width:32px;height:32px;font-size:13px}
.logo i{display:block;width:16px;height:5px;background:#fff}
.band h1{font-size:clamp(17px,2.2vw,22px);font-weight:700;letter-spacing:-.01em}
.bullet{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;color:#fff;font-weight:700;font-size:19px;flex:none;background:var(--lv)}
.bullet.diamond{border-radius:5px;transform:rotate(45deg);width:30px;height:30px;margin:3px}
.bullet.diamond>span{transform:rotate(-45deg)}
.spacer{flex:1}
.bandbtn{background:none;border:2px solid #ffffff55;color:#fff;border-radius:10px;height:40px;min-width:40px;padding:0 12px;font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.bandbtn:hover{border-color:#fff}
.bandbtn:disabled{opacity:.35;cursor:default}
.pchip{padding:0 12px 0 4px;border-radius:999px}
.avatar{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-weight:700;font-size:15px;flex:none;color:#fff}
.trip b{display:block;font-size:17px;font-weight:700}
.trip small{display:block;color:#b9bbb4;font-size:13px;margin-top:2px}
.clock{display:flex;flex-direction:column;align-items:flex-end;min-width:86px;line-height:1}
.clock b{font-variant-numeric:tabular-nums;font-size:24px}
.clock b.slow{color:var(--orange)}
.clock small{font-size:12px;color:#b9bbb4;margin-top:4px;white-space:nowrap}
.remain{border:2px solid #ffffff55;border-radius:999px;padding:4px 10px;font-size:14px;color:#ddd;white-space:nowrap}
.remain b{font-variant-numeric:tabular-nums;color:#fff}
.remain.low{border-color:var(--red);color:#fff;background:var(--red)}
.combo{display:flex;flex-direction:column;align-items:center;min-width:64px;line-height:1}
.combo b{font-size:24px;color:var(--yellow);font-variant-numeric:tabular-nums}
.combo small{font-size:12px;color:#b9bbb4;margin-top:4px}
.combo.hot b{color:var(--orange)}
.combo.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.35)}}
.scorebox{text-align:right;min-width:78px}
.scorebox b{display:block;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.scorebox small{font-size:12px;color:#b9bbb4}

/* ---------- chrono ---------- */
.timer{height:9px;background:var(--paper2);position:sticky;top:64px;z-index:19}
#timerFill{height:100%;width:100%;background:var(--lv);transition:width .12s linear}
.timer.low #timerFill{background:var(--red);animation:blink .45s infinite alternate}
.timer.free #timerFill{background:repeating-linear-gradient(90deg,var(--lv) 0 22px,transparent 22px 30px);opacity:.5}
@keyframes blink{to{opacity:.45}}

/* ---------- pages ---------- */
.wrap{max-width:1000px;margin:0 auto;padding:clamp(16px,4vw,40px) clamp(14px,4vw,32px) 60px}
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(18px,4vw,48px);align-items:center}
.hero h2,.ptitle{font-size:clamp(30px,4.6vw,52px);line-height:1.02;letter-spacing:-.03em;font-weight:700}
.hero p,.lead{font-size:17px;line-height:1.5;max-width:50ch;color:#24262a;margin:16px 0 0}
#heroMap{width:100%;height:auto;display:block}
#heroMap .hl{stroke-dasharray:420;stroke-dashoffset:420;animation:drawIn .9s ease-out forwards}
#heroMap .d1{animation-delay:.35s}#heroMap .d2{animation-delay:.95s}#heroMap .d3{animation-delay:1.55s}
@keyframes drawIn{to{stroke-dashoffset:0}}
.section-title{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:40px 0 14px}
.rankline{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-top:34px}
.rankline .rk{font-size:26px;font-weight:700;letter-spacing:-.02em}
.rankline .pts{color:var(--muted);font-size:15px}
.meter{height:12px;background:#fff;border:2px solid var(--ink);border-radius:999px;overflow:hidden;margin-top:10px}
.meter>span{display:block;height:100%;background:var(--ink);border-radius:999px}
.strip{display:flex;height:22px;border-radius:999px;overflow:hidden;border:2px solid var(--ink);background:#fff;margin-top:8px}
.strip span{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:14px;color:#2b2d31}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid #0003}
.levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lv{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:12px;text-align:left;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:12px 14px}
.lv b{font-size:18px;display:block}
.lv small{display:block;color:var(--muted);font-size:14px;line-height:1.35;margin-top:3px}
.lv[aria-checked="true"]{background:var(--ink);color:#fff}
.lv[aria-checked="true"] small{color:#c9cbc4}
.opts{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-start}
.opt h4{margin:0 0 8px;font-size:15px;font-weight:700}
.seg{display:inline-flex;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff;flex-wrap:wrap}
.seg button{border:0;background:none;padding:10px 18px;font-size:16px;font-weight:700}
.seg button+button{border-left:2px solid var(--ink)}
.seg button[aria-checked="true"]{background:var(--ink);color:#fff}
.seg.small button{padding:7px 14px;font-size:14px}
.check{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 16px;font-size:16px;font-weight:700;margin-top:14px;max-width:560px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--ink);flex:none}
.check small{display:block;font-weight:400;color:var(--muted);font-size:14px;margin-top:2px}
.check.off{opacity:.5;cursor:default}
.go{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:34px}
.cta{background:var(--ink);color:#fff;border:0;border-radius:999px;padding:16px 34px;font-size:20px;font-weight:700;display:inline-flex;align-items:center;gap:12px}
.cta .bullet{width:28px;height:28px;font-size:15px}
.cta .bullet.diamond{width:22px;height:22px}
.cta:hover{background:#222}
.ghost{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:12px 22px;font-size:16px;font-weight:700}
.ghost:disabled{opacity:.45;cursor:default}
.ghost.danger{border-color:var(--red);color:var(--red)}
.note{font-size:14px;color:var(--muted);margin-top:10px;line-height:1.45}
.err{color:var(--red);font-weight:700;min-height:20px;margin:8px 0 0}

/* ---------- joueurs ---------- */
.pgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:start}
.ranking{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.prow{display:grid;grid-template-columns:28px 40px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 14px}
.prow:hover{background:#fafaf7}
.prow.cur{box-shadow:0 0 0 4px rgba(252,204,10,.6)}
.prow .pos{font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.prow .avatar{width:40px;height:40px;font-size:18px}
.prow b{display:block;font-size:18px}
.prow small{display:block;color:var(--muted);font-size:13px;margin-top:2px;line-height:1.35}
.prow .pscore{text-align:right}
.prow .pscore b{font-size:22px;font-variant-numeric:tabular-nums}
.signup{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:20px}
.field{display:block;font-weight:700;font-size:15px;margin:14px 0 0;border:0;padding:0}
.field legend{padding:0;margin-bottom:8px}
.field input{display:block;width:100%;margin-top:6px;font-size:18px;padding:10px 14px;border:3px solid var(--ink);border-radius:12px;background:#fff}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #0002}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}

/* ---------- plateau ---------- */
.playwrap{max-width:900px;margin:0 auto;padding:14px clamp(8px,2vw,20px) 40px}
.tip{text-align:center;color:var(--muted);font-size:14px;margin:4px 0 12px}
.colhead{display:grid;grid-template-columns:minmax(0,1fr) var(--gap) minmax(0,1fr);font-size:13px;color:var(--muted);margin-bottom:6px}
.colhead span:first-child{text-align:right;padding-right:22px}
.colhead span:last-child{padding-left:22px}
.board{position:relative;display:grid;grid-template-columns:minmax(0,1fr) var(--gap) minmax(0,1fr);background:var(--paper)}
#lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:0}
.col{display:flex;flex-direction:column;gap:7px;position:relative;z-index:1}
.stop{position:relative;display:flex;align-items:center;width:100%;height:var(--pillH);padding:0 22px;border:3px solid var(--ink);border-radius:999px;background:#fff;font-size:17px;font-weight:500;white-space:nowrap;transition:background .15s,color .15s,border-color .15s,box-shadow .15s;touch-action:manipulation}
.stop.lang-en{font-weight:700}
.stop .txt{overflow:hidden;text-overflow:ellipsis}
.stop.L{justify-content:flex-end}
.stop.R{justify-content:flex-start}
.stop .dot{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--ink);transform:translateY(-50%)}
.stop.L .dot{right:-10px}
.stop.R .dot{left:-10px}
.stop:hover{border-color:var(--blue)}
.stop.masked{background:#F5F5F0;border-style:dashed}
.stop.masked .num{font-variant-numeric:tabular-nums;color:var(--muted)}
.stop.sel{background:var(--yellow);border-color:var(--ink);border-style:solid;box-shadow:0 0 0 5px rgba(252,204,10,.45)}
.stop.done{background:var(--c);border-color:var(--c);border-style:solid;color:var(--tc)}
.stop.done .dot{background:#fff;border-color:var(--c)}
.stop.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.06)}}
.stop.bad{animation:shake .4s;border-color:var(--red);background:#fde3e1}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.stop.hint{animation:hint .45s ease-in-out 4}
@keyframes hint{50%{background:var(--yellow);transform:scale(1.05)}}
.stop.missed{border-style:dashed;border-color:var(--red);color:var(--red);background:#fff}
.float{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:19px;pointer-events:none;animation:floatUp 1s ease-out forwards;z-index:5;text-shadow:0 0 3px #fff,0 0 8px #fff}
.float.big{font-size:26px;color:var(--blue)}
.float.bad{color:var(--red)}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-20%)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-170%)}}

/* ---------- fenêtre ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:50;padding:16px}
.sheet{background:#fff;border-radius:20px;max-width:620px;width:100%;max-height:92vh;overflow:auto;padding:26px 26px 22px;border-top:14px solid var(--lv)}
.m-title{font-size:30px;letter-spacing:-.02em}
.m-sub{color:var(--muted);margin:8px 0 0;line-height:1.45}
.stars{margin-top:8px;font-size:42px;letter-spacing:4px}
.star{color:var(--paper2)}
.star.on{color:var(--yellow);text-shadow:0 2px 0 #b8940a}
.m-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 0}
.m-grid div{background:var(--paper);border-radius:12px;padding:10px}
.m-grid dt{font-size:13px;color:var(--muted)}
.m-grid dd{margin:4px 0 0;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.m-grid dd small{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:3px}
.verdict{font-size:15px;font-weight:700;margin-top:12px}
.verdict.good{color:var(--green)}
.verdict.meh{color:var(--orange)}
.bonus{font-size:14px;color:var(--green);font-weight:700;margin-top:6px}
.sheet h3{font-size:17px;margin:20px 0 8px}
.review{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.review li{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--paper2);padding-bottom:6px}
.say{background:none;border:2px solid var(--ink);border-radius:999px;padding:4px 12px;font-weight:700;font-size:15px}
.say:hover{background:var(--yellow)}
.m-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.m-actions .cta{font-size:18px;padding:14px 26px}
.newbadges{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px}
.setrow{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:14px 0;font-size:16px}
.setrow select,.setrow input[type=range]{flex:1;min-width:160px;font-size:15px}
.setrow input[type=checkbox]{width:22px;height:22px;accent-color:var(--ink)}
.pinin{font-size:28px;letter-spacing:10px;width:170px;text-align:center;padding:8px;border:3px solid var(--ink);border-radius:12px;margin-top:14px}

/* ---------- statistiques ---------- */
.actbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.chartbox{position:relative;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:12px 12px 6px;margin-top:12px}
.chartbox svg{display:block}
.chartbox .ax{font-size:12px;fill:var(--muted);font-family:var(--font)}
.chartbox .ax.today{fill:var(--ink);font-weight:700}
.chartbox .val{font-size:12px;fill:var(--ink);font-weight:700;font-family:var(--font)}
.chartbox .hit{cursor:pointer}
.chartbox .hit:hover{fill:rgba(0,0,0,.04)}
.tipbox{position:absolute;pointer-events:none;background:var(--ink);color:#fff;border-radius:10px;padding:8px 11px;font-size:13px;line-height:1.4;white-space:nowrap;transform:translate(-50%,-100%);z-index:3}
.tipbox b{display:block}
.actsum{font-size:16px;margin:12px 0 0}
details.tbl{margin-top:8px;font-size:14px}
details.tbl summary{cursor:pointer;color:var(--muted)}
.net{display:grid;grid-template-columns:repeat(auto-fill,minmax(12px,1fr));gap:3px;margin-top:10px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:12px}
.net i{display:block;aspect-ratio:1;border-radius:50%;background:#d9dbd4;cursor:pointer}
.net i.s{background:var(--blue)} .net i.k{background:var(--red)} .net i.m{background:var(--green)}
.net i:hover{outline:2px solid var(--ink)}
.netcap{min-height:24px;margin-top:8px;font-weight:700}
table.hard{width:100%;border-collapse:collapse;background:#fff;border:3px solid var(--ink);border-radius:16px;overflow:hidden}
table.hard th,table.hard td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--paper2);font-size:15px}
table.hard th{font-size:13px;color:var(--muted);font-weight:500}
table.hard td.n{font-variant-numeric:tabular-nums;font-weight:700}
table.hard tr.cur td{background:#fff8d6}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.badge{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:12px}
.badge .ic{font-size:28px}
.badge b{display:block;margin-top:4px}
.badge small{color:var(--muted);font-size:13px;line-height:1.35;display:block;margin-top:2px}
.badge.locked{border-style:dashed;border-color:#9a9c96;opacity:.55}
.badge.locked .ic{filter:grayscale(1)}
.records{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.records div{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:12px}
.records b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.records small{color:var(--muted);font-size:13px}
.btnrow{display:flex;flex-wrap:wrap;gap:12px}

/* ---------- toasts & confettis ---------- */
#toasts{position:fixed;right:14px;top:78px;display:grid;gap:8px;z-index:60;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:14px;padding:10px 16px 10px 12px;box-shadow:0 6px 20px #0004;animation:tin .3s ease-out}
.toast .t-ic{font-size:26px}
.toast b{display:block;font-size:13px;color:var(--yellow)}
.toast span{font-size:15px;font-weight:700}
.toast.out{opacity:0;transform:translateX(30px);transition:.35s}
@keyframes tin{from{opacity:0;transform:translateX(30px)}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

/* ---------- petits écrans ---------- */
@media (max-width:760px){
  .hero,.pgrid{grid-template-columns:1fr}
  .levels{grid-template-columns:1fr}
  .m-grid{grid-template-columns:repeat(2,1fr)}
  .records{grid-template-columns:repeat(2,minmax(0,1fr))}
  .prow{grid-template-columns:24px 36px 1fr auto;gap:10px;padding:10px}
  .prow .avatar{width:36px;height:36px}
}
@media (max-width:560px){
  :root{--pillH:33px;--gap:46px}
  .stop{font-size:14px;padding:0 13px;border-width:2px}
  .stop .dot{width:13px;height:13px;border-width:2px}
  .stop.L .dot{right:-8px}.stop.R .dot{left:-8px}
  .col{gap:5px}
  .band{gap:8px;min-height:56px}
  .trip small,.combo small{display:none}
  .clock{min-width:60px}.clock b{font-size:19px}
  .scorebox b{font-size:21px}
  .combo{min-width:40px}
  .bandbtn{height:36px;min-width:36px;padding:0 8px}
  .pchip span:last-child{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .seg button{padding:9px 13px;font-size:15px}
}
@media (max-height:820px) and (min-width:561px){
  :root{--pillH:33px}
  .col{gap:5px}
  .stop{font-size:16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition:none !important}
  #heroMap .hl{stroke-dashoffset:0}
}

/* ---------- v3 : phrases, classement, GitHub, langue ---------- */
.stop.tgt{font-weight:700}
.bandbtn.cloud.ok{border-color:#6CBE45}
.bandbtn.cloud.err{border-color:var(--red)}
.bandbtn.cloud.busy{animation:blink .6s infinite alternate}
.langseg{margin-top:6px}
.sent-src{display:flex;gap:14px;align-items:center;background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;margin-top:14px}
.sent-text{font-size:clamp(19px,3.4vw,24px);font-weight:700;line-height:1.25;margin:0}
.sent-src .say{background:#fff;flex:none}
.sent-lab{font-size:14px;color:var(--muted);margin:14px 0 6px;font-weight:700}
.slots{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-radius:14px;background:var(--paper);min-height:66px;align-items:center}
.slot{display:inline-block;min-width:54px;height:42px;border:2px dashed #9a9c96;border-radius:999px}
.chipw{border:3px solid var(--ink);background:#fff;border-radius:999px;padding:6px 16px;font-size:18px;font-weight:600;min-height:42px;touch-action:manipulation}
.chipw:hover:not(:disabled){border-color:var(--blue)}
.chipw.used{border-style:dashed;border-color:#c5c7c0;color:transparent;background:var(--paper);cursor:default}
.chipw.ok{background:var(--green);border-color:var(--green);color:#fff}
.chipw.no{background:#fde3e1;border-color:var(--red);animation:shake .4s}
.chipw.final{background:var(--green);border-color:var(--green);color:#fff}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.sent-ref{background:var(--paper);border-radius:12px;padding:10px 14px;margin-top:12px;line-height:1.5}
.sent-ref b{display:block}
.tabs{margin:14px 0 0}
.rkrow{display:grid;grid-template-columns:34px 40px 1fr auto;align-items:center;gap:12px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 14px}
.rkrow.cur{box-shadow:0 0 0 4px rgba(252,204,10,.6)}
.rkrow .pos{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;font-weight:700;font-size:16px;background:var(--paper2);font-variant-numeric:tabular-nums}
.rkrow .pos.p1{background:#FCCC0A}.rkrow .pos.p2{background:#BBBDBF}.rkrow .pos.p3{background:#996633;color:#fff}
.rkrow .avatar{width:40px;height:40px;font-size:18px}
.rkrow b{display:block;font-size:18px}
.rkrow small{display:block;color:var(--muted);font-size:13px;margin-top:2px;line-height:1.35}
.rkrow .pscore{text-align:right}
.rkrow .pscore b{font-size:22px;font-variant-numeric:tabular-nums}
.remote{display:grid;gap:8px;margin-top:10px}
.remote .prow{grid-template-columns:40px 1fr auto}
.ghform .field input{font-size:16px;padding:8px 12px}
.ghform .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ghstat{margin:12px 0 0;font-weight:700;font-size:15px}
.ghstat.ok{color:var(--green)}.ghstat.err{color:var(--red)}
.steps{margin:8px 0 0;padding-left:20px;line-height:1.5;font-size:14px}
.sspin{color:var(--muted);margin:16px 0}
@media (max-width:560px){
  .rkrow{grid-template-columns:30px 36px 1fr auto;gap:9px;padding:9px}
  .rkrow .avatar{width:36px;height:36px}
  .ghform .two{grid-template-columns:1fr}
  .chipw{font-size:16px;padding:5px 13px}
}

<body>
<!-- Bandeau : choix du joueur -->
<header class="band" id="bandPlayers" hidden>
  <div class="logo" aria-hidden="true"><span class="bullet" style="background:var(--blue)">EN</span><i></i><span class="bullet" style="background:var(--red)">FR</span></div>
  <h1 class="brand"></h1>
  <div class="spacer"></div>
  <button class="bandbtn" id="btnRankP"></button>
  <button class="bandbtn cloud" id="btnCloudP">☁</button>
</header>

<!-- Bandeau : accueil -->
<header class="band" id="bandHome" hidden>
  <div class="logo" aria-hidden="true"><span class="bullet" style="background:var(--blue)">EN</span><i></i><span class="bullet" style="background:var(--red)">FR</span></div>
  <h1 class="brand"></h1>
  <div class="spacer"></div>
  <button class="bandbtn pchip" id="btnPlayer"><span class="avatar" id="hAvatar">?</span><span id="hName"></span></button>
  <button class="bandbtn" id="btnRank"></button>
  <button class="bandbtn" id="btnStats"></button>
  <button class="bandbtn cloud" id="btnCloud">☁</button>
  <button class="bandbtn" id="btnSettings">⚙</button>
</header>

<!-- Bandeau : partie -->
<header class="band" id="bandPlay" hidden>
  <span id="pBullet" class="bullet"><span>1</span></span>
  <div class="trip"><b id="pList"></b><small id="pProg"></small></div>
  <div class="spacer"></div>
  <div class="remain" id="pLeft" hidden><span id="pLeftL"></span> <b>1:20</b></div>
  <div class="clock" id="pClock"><b id="pTime">0:00</b><small id="pAvg"></small></div>
  <div id="pCombo" class="combo"><b>×1</b><small></small></div>
  <div class="scorebox"><b id="pScore">0</b><small id="pPts"></small></div>
  <button class="bandbtn" id="pHint">💡 <span id="pHints">3</span></button>
  <button class="bandbtn" id="pSound">🔊</button>
  <button class="bandbtn" id="pQuit">✕</button>
</header>

<!-- Bandeau : statistiques -->
<header class="band" id="bandStats" hidden>
  <button class="bandbtn" id="btnBack"></button>
  <h1 id="statsTitle"></h1>
</header>

<!-- Bandeau : classement -->
<header class="band" id="bandRank" hidden>
  <button class="bandbtn" id="btnBackRank"></button>
  <h1 id="rankTitle"></h1>
</header>

<main>
  <!-- JOUEURS -->
  <section id="players" class="wrap" hidden></section>

  <!-- ACCUEIL -->
  <section id="home" class="wrap" hidden>
    <div class="hero">
      <div>
        <h2 id="heroTitle"></h2>
        <p id="heroText"></p>
      </div>
      <svg id="heroMap" viewBox="0 0 560 200" role="img"></svg>
    </div>

    <div class="rankline"><span class="rk" id="hRank"></span><span class="pts" id="hPts"></span></div>
    <div class="meter" aria-hidden="true"><span id="hMeter" style="width:0%"></span></div>
    <p class="note" id="hNext"></p>

    <h3 class="section-title" id="secMap"></h3>
    <div class="strip" id="hStrip" aria-hidden="true"></div>
    <div class="legend" id="hLegend"></div>

    <h3 class="section-title" id="secLine"></h3>
    <div class="levels" id="levels" role="radiogroup"></div>

    <h3 class="section-title" id="secTrip"></h3>
    <div class="opts">
      <div class="opt"><h4 id="dirLabel"></h4><div class="seg" id="dirSeg" role="radiogroup"></div></div>
      <div class="opt"><h4 id="sessLabel"></h4><div class="seg" id="session" role="radiogroup"></div></div>
    </div>
    <label class="check" id="maskRow"><input type="checkbox" id="maskChk"><span><span id="maskTxt"></span><small id="maskNote"></small></span></label>

    <div class="go">
      <button class="cta" id="btnGo"><span class="bullet" id="goBullet"><span>1</span></span><span id="goTxt"></span></button>
      <button class="ghost" id="btnRevenge"></button>
      <button class="ghost" id="btnSentence"></button>
    </div>
    <p class="note" id="revNote"></p>
    <p class="note" id="sentNote"></p>
  </section>

  <!-- PARTIE -->
  <section id="play" hidden>
    <div class="timer" id="timer"><div id="timerFill"></div></div>
    <div class="playwrap">
      <p class="tip" id="tip"></p>
      <div class="colhead" aria-hidden="true"><span id="headL"></span><span></span><span id="headR"></span></div>
      <div class="board" id="board">
        <svg id="lines" aria-hidden="true">
          <defs>
            <marker id="arrowRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#EE352E"/></marker>
            <marker id="arrowInk" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
          </defs>
          <g id="linesG"></g>
          <g id="flashG"></g>
          <path id="rubber" d="" stroke="#000" stroke-width="4" stroke-dasharray="3 9" stroke-linecap="round" fill="none" marker-end="url(#arrowInk)"/>
        </svg>
        <div class="col" id="colL"></div>
        <div></div>
        <div class="col" id="colR"></div>
      </div>
    </div>
  </section>

  <!-- STATISTIQUES -->
  <section id="stats" class="wrap" hidden></section>

  <!-- CLASSEMENT -->
  <section id="rank" class="wrap" hidden></section>
</main>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toasts" aria-live="polite"></div>
<canvas id="confetti" hidden></canvas>

function weightedPick(items, wf, k){
  const pool=items.slice(), out=[];
  while(out.length<k && pool.length){
    let tot=0; for(const it of pool) tot+=Math.max(.01,wf(it));
    let r=Math.random()*tot, idx=0;
    for(; idx<pool.length; idx++){ r-=Math.max(.01,wf(pool[idx])); if(r<=0) break; }
    out.push(pool.splice(Math.min(idx,pool.length-1),1)[0]);
  }
  return out;
}

/* =========================================================
   Choix des mots d'une liste (répétition espacée)
   ========================================================= */
function taker(N){
  const chosen=[], usedEn=new Set(), usedFr=new Set();
  const take = w=>{
    if(!w || chosen.length>=N) return;
    const f=w.fr.toLowerCase(), e=w.en.toLowerCase();
    if(usedEn.has(e) || usedFr.has(f)) return;
    chosen.push(w); usedEn.add(e); usedFr.add(f);
  };
  return {chosen, take};
}
function makeList(level){
  const L=LEVELS[level], pool=WORDS.slice(L.lo, L.hi), N=sizeOf();
  const {chosen, take} = taker(N);
  // 1) les mots ratés reviennent, tirés au sort selon leur nombre d'erreurs
  const review = pool.filter(w=>{ const s=peek(w.en); return s && s.w>0; });
  weightedPick(review, w=>peek(w.en).w, Math.min(Math.round(N*.4), review.length)).forEach(take);
  // 2) des mots nouveaux : moitié dans l'ordre de fréquence, moitié au hasard dans la ligne
  let unseen = pool.filter(w=>{ const s=peek(w.en); return !isSeen(s) && !(s && s.w>0); });
  if(level===3){
    unseen = shuffle(unseen.filter(w=>w.rank>500)).concat(shuffle(unseen.filter(w=>w.rank<=500)));
  } else {
    const front=shuffle(unseen.slice(0,30)), rest=shuffle(unseen.slice(30)), mixed=[];
    while(front.length || rest.length){ if(front.length) mixed.push(front.shift()); if(rest.length) mixed.push(rest.shift()); }
    unseen = mixed;
  }
  const cap = N-Math.max(1,Math.round(N*.15));
  for(const w of unseen){ if(chosen.length>=cap) break; take(w); }
  // 3) quelques mots déjà connus, les plus anciens en priorité
  const known = pool.filter(w=>{ const s=peek(w.en); return isSeen(s) && s.w===0; }).sort((a,b)=>peek(a.en).t-peek(b.en).t);
  shuffle(known.slice(0,40)).forEach(take);
  unseen.forEach(take);
  shuffle(review.slice()).forEach(take);
  shuffle(pool.slice()).forEach(take);
  return shuffle(chosen);
}
function weakWords(){
  return WORDS.filter(w=>{ const s=peek(w.en); return s && s.w>0; })
    .sort((a,b)=>(peek(b.en).w-peek(a.en).w) || (peek(b.en).err-peek(a.en).err));
}
function makeRevengeList(){
  const {chosen, take} = taker(sizeOf());
  weakWords().forEach(take);
  WORDS.filter(w=>{ const s=peek(w.en); return s && s.err>0; }).sort((a,b)=>peek(b.en).err-peek(a.en).err).forEach(take);
  shuffle(WORDS.filter(w=>isSeen(peek(w.en)))).forEach(take);
  shuffle(WORDS.slice(0,300)).forEach(take);
  return shuffle(chosen);
}

const TTS = 'speechSynthesis' in window;
let voices = [];
function refreshVoices(){ if(!TTS) return; voices = speechSynthesis.getVoices() || []; fillVoiceSelect(); }

function tVoices(){
  if(tar()==='en'){
    const us = voices.filter(v=>/^en[-_]US/i.test(v.lang));
    return us.length ? us : voices.filter(v=>/^en/i.test(v.lang));
  }
  const fr = voices.filter(v=>/^fr[-_]FR/i.test(v.lang));
  return fr.length ? fr : voices.filter(v=>/^fr/i.test(v.lang));
}
function bestVoice(){
  const list = tVoices(), name = opt('voiceName');
  if(name){ const v=list.find(v=>v.name===name); if(v) return v; }
  const pref = tar()==='en'
    ? [/natural/i, /aria|jenny|guy|ava|andrew|emma|brian|michelle/i, /google us/i, /samantha|alex/i, /zira|david|mark/i]
    : [/natural/i, /denise|henri|eloise|vivienne|remy|brigitte/i, /google fran/i, /am[eé]lie|thomas|audrey/i, /hortense|julie|paul/i];
  for(const re of pref){ const v=list.find(v=>re.test(v.name)); if(v) return v; }
  return list[0] || null;
}
// prononce toujours un texte écrit dans la langue apprise
function speak(text, force){
  if(!TTS || (!opt('voice') && !force)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = tar()==='en' ? 'en-US' : 'fr-FR';
    const v = bestVoice(); if(v) u.voice = v;
    u.rate = opt('rate'); u.pitch = 1;
    speechSynthesis.speak(u);
  }catch(e){}
}

function tone(f, d, type, vol, delay){
  const a=ac(); if(!a) return;
  const t=a.currentTime+(delay||0), o=a.createOscillator(), g=a.createGain();

  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d+.05);
}

function show(which){
  curScreen=which;
  for(const k in screens){ screens[k][0].hidden = k!==which; screens[k][1].hidden = k!==which; }
  if(which==='players'){ setLang(DB.lang); renderPlayers(); }

  window.scrollTo(0,0);
}

function fillRemote(rk){
  const box=$('#remoteBox'); if(!box || curScreen!=='players' || !rk) return;
  const others=Object.values(rk.players).filter(r=>!DB.players[r.id]).sort((a,b)=>(b.score||0)-(a.score||0));
  if(!others.length){ box.innerHTML=''; return; }
  box.innerHTML = `<h3 class="section-title">${t('Profils sur GitHub')}</h3>
    <p class="note" style="margin-top:-6px">${t('Ces joueurs ne sont pas encore sur cet ordinateur. Récupère ton profil pour retrouver ta progression.')}</p>
    <div class="remote">${others.map(r=>`<div class="prow"><span class="avatar" style="${avatarStyle(r.color||'#0039A6')}">${esc(initial(r.name))}</span>
      <span><b>${esc(r.name)}</b><small>${esc(rankName(rankOf(r.score||0), r.lang||'fr'))}, ${plural(r.lists||0,'liste jouée','listes jouées')}</small></span>
      <button class="ghost" data-imp="${esc(r.id)}">${t('Récupérer')}</button></div>`).join('')}</div>`;
  box.querySelectorAll('[data-imp]').forEach(b=>b.addEventListener('click', ()=>importRemote(b.dataset.imp)));
}
function choosePlayer(id){
  const p=DB.players[id]; if(!p) return;
  if(p.pin){
    pendingPid=id; pendingImport=null;
    openModal(`<h2 class="m-title">${t('Code de {name}',{name:esc(p.name)})}</h2>
      <p class="m-sub">${t('Tape ton code à 4 chiffres.')}</p>
      <input class="pinin" id="pinIn" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="${t('Code à 4 chiffres')}" data-autofocus>
      <p class="err" id="pinErr" role="alert"></p>
      <div class="m-actions"><button class="cta" data-action="pinOk">${t('Valider')}</button><button class="ghost" data-action="close">${t('Annuler')}</button></div>`);
    $('#pinIn').addEventListener('keydown', e=>{ if(e.key==='Enter') checkPin(); });
    return;
  }
  openPlayer(id);
}
function openPlayer(id){ setPlayer(id); show('home'); if(ghReady()) syncNow({silent:true}); }
function checkPin(){
  const v=$('#pinIn').value.trim();
  if(pendingImport){
    if(v===(pendingImport.pin||'')){ const o=pendingImport; pendingImport=null; closeModal(); finishImport(o); }
    else { $('#pinErr').textContent=t('Code incorrect.'); $('#pinIn').select(); sfx.bad(); }
    return;
  }
  const p=DB.players[pendingPid];
  if(p && v===p.pin){ closeModal(); openPlayer(p.id); }
  else { $('#pinErr').textContent=t('Code incorrect.'); $('#pinIn').select(); sfx.bad(); }
}

function heroSVG(){
  // la langue apprise est à gauche (en gras), l'autre à droite, de A à Z
  const fr = LANG==='fr';
  const left  = fr ? ['House','Dog','Rabbit'] : ['Maison','Chien','Lapin'];
  const right = fr ? ['Chien','Lapin','Maison'] : ['Dog','House','Rabbit'];
  const to    = fr ? [160,40,100] : [100,40,160];       // arrivée (y) de chaque mot de gauche
  const cols  = ['#0039A6','#FF6319','#00933C'];
  const ys    = [40,100,160];
  let s = `<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="19">`;
  ys.forEach((y,i)=>{
    const d=`M172,${y} C290,${y} 270,${to[i]} 388,${to[i]}`;
    s+=`<path class="hl d${i+1}" d="${d}" stroke="#fff" stroke-width="12" fill="none" stroke-linecap="round"/><path class="hl d${i+1}" d="${d}" stroke="${cols[i]}" stroke-width="7" fill="none" stroke-linecap="round"/>`;
  });
  s+=`<g stroke="#000" stroke-width="3" fill="#fff">`;
  ys.forEach(y=>{ s+=`<rect x="20" y="${y-19}" width="150" height="38" rx="19"/><rect x="390" y="${y-19}" width="150" height="38" rx="19"/><circle cx="172" cy="${y}" r="8"/><circle cx="388" cy="${y}" r="8"/>`; });
  s+=`</g>`;
  ys.forEach((y,i)=>{ s+=`<text x="150" y="${y+7}" text-anchor="end">${left[i]}</text><text x="410" y="${y+7}" font-weight="500">${right[i]}</text>`; });
  return s+`</g>`;
}

let G = null;
const board=$('#board'), colL=$('#colL'), colR=$('#colR'), linesG=$('#linesG'), flashG=$('#flashG'), rubber=$('#rubber');
const svgNS='http://www.w3.org/2000/svg';
function capLang(l){ return l==='en' ? t('Anglais') : t('Français'); }

function startSession(mode){
  G = {mode, level:S.settings.level, total: mode==='revenge' ? 1 : S.settings.session, index:0,
       sessionScore:0, sessionOk:0, sessionBad:0, sessionMissed:0, streak:0};
  show('play');
  nextList();
}
function nextList(){
  closeModal();
  const L = LEVELS[G.level]; setLevelColor(L);
  G.index++;
  const words = G.mode==='revenge' ? makeRevengeList() : makeList(G.level);
  const dir = S.settings.dir, lL = dir==='tn' ? tar() : LANG, lR = dir==='tn' ? LANG : tar();
  const right = words.slice().sort((a,b)=>textOf(a,lR).localeCompare(textOf(b,lR), lR, {sensitivity:'base'}));
  const N = words.length, tb = S.times[N];
  Object.assign(G, {
    left:words, right, lL, lR, dir, mask: dir==='tn' && S.settings.mask && TTS,
    time: L.time ? Math.round(L.time*N/15) : 0,
    matched:new Map(), missed:[], errors:0, combo:0, maxCombo:0, listScore:0, wrongWords:new Set(), hinted:new Set(),
    sel:null, hints:L.hints, penalty:0, t0:performance.now(), pausedAt:null, over:false, finishing:false,
    endElapsed:null, colorBase:Math.floor(Math.random()*LINE_COLORS.length), lastTick:null, sentenceDue:false,
    avgBefore: avgTime(N), bestBefore: tb && tb.n ? tb.best : null
  });
  $('#pBullet').outerHTML = bulletHTML(L,'pBullet');
  $('#tip').textContent = G.mask
    ? t('Clique un 🔊 pour écouter le mot {tg}, puis clique sa traduction à droite. Le mot apparaît une fois relié.', {tg:tAdj()})
    : lL===tar() ? t('Clique un mot {tg} pour l’entendre, puis sa traduction à droite.', {tg:tAdj()})
    : t('Clique un mot {nt}, puis sa traduction à droite. Chaque mot {tg} cliqué est prononcé.', {nt:nAdj(), tg:tAdj()});
  $('#headL').textContent = G.mask ? t('{lang}, à l’oreille', {lang:capLang(lL)}) : capLang(lL);
  $('#headR').textContent = t('{lang}, de A à Z', {lang:capLang(lR)});
  renderBoard(); updateBand(); placeTimer(); sfx.chime(); startTimer();
}
function pill(side, w, i){
  const lang = side==='L' ? G.lL : G.lR;
  const b=document.createElement('button');
  b.type='button'; b.className=`stop ${side}${lang===tar()?' tgt':''}`;
  b.innerHTML='<span class="txt"></span><span class="dot"></span>';
  if(side==='L' && G.mask){
    b.classList.add('masked');
    b.firstChild.innerHTML = `<span aria-hidden="true">🔊</span> <span class="num">${i+1}</span>`;
    b.setAttribute('aria-label', t('Mot {tg} numéro {n}, masqué : clique pour l’écouter', {tg:tAdj(), n:i+1}));
  } else {
    b.firstChild.textContent = textOf(w, lang);
    b.setAttribute('aria-label', lang===tar() ? t('{w} ({tg}, clique pour l’entendre)', {w:textOf(w,lang), tg:tAdj()}) : t('{w} ({nt})', {w:textOf(w,lang), nt:nAdj()}));
  }
  b.addEventListener('click', ()=>onPillClick(side,i));
  return b;
}
function renderBoard(){
  colL.innerHTML=''; colR.innerHTML=''; linesG.innerHTML=''; flashG.innerHTML=''; rubber.setAttribute('d','');
  G.left.forEach((w,i)=>colL.appendChild(pill('L',w,i)));
  G.right.forEach((w,i)=>colR.appendChild(pill('R',w,i)));
}
function elL(w){ return colL.children[G.left.indexOf(w)]; }
function elR(w){ return colR.children[G.right.indexOf(w)]; }
function reveal(w){
  const el=elL(w); if(!el || !el.classList.contains('masked')) return;
  const txt=textOf(w,tar());
  el.classList.remove('masked'); el.firstChild.textContent=txt; el.setAttribute('aria-label', t('{w} ({tg})',{w:txt, tg:tAdj()}));
}
function comboMult(c){ return Math.min(5, 1+Math.floor(c/3)); }
function curScore(){ return G ? G.sessionScore + (G.over ? 0 : G.listScore) : 0; }

function updateBand(){
  if(!G) return;
  const L=LEVELS[G.level], N=G.left.length;
  $('#pList').textContent = G.mode==='revenge' ? t('Revanche') : t('Liste {i} / {n}', {i:G.index, n:G.total});
  $('#pProg').textContent = t('{m} sur {n} reliés', {m:G.matched.size, n:N});
  $('#pScore').textContent = nf(curScore());
  const cm = comboMult(G.combo), cb=$('#pCombo');
  cb.querySelector('b').textContent='×'+cm;
  cb.querySelector('small').textContent=t('série {n}', {n:G.combo});
  cb.classList.toggle('hot', cm>=3);
  $('#pAvg').textContent = G.avgBefore!=null ? t('moyenne {x}', {x:fmt(G.avgBefore)}) : t('moyenne : aucune');
  $('#pHints').textContent = G.hints;
  $('#pHint').disabled = G.hints<=0 || G.over;
  $('#pHint').hidden = L.hints===0;
  $('#pSound').textContent = S.settings.sound ? '🔊' : '🔇';
}
function bumpCombo(){ const cb=$('#pCombo'); cb.classList.remove('bump'); void cb.offsetWidth; cb.classList.add('bump'); }

/* ---------- clics ---------- */
function clearSel(){
  if(G) G.sel=null;
  document.querySelectorAll('.stop.sel').forEach(e=>e.classList.remove('sel'));
  rubber.setAttribute('d','');
}
function onPillClick(side, i){
  if(!G) return;
  const w = side==='L' ? G.left[i] : G.right[i];
  const el = side==='L' ? colL.children[i] : colR.children[i];
  const lang = side==='L' ? G.lL : G.lR;
  if(G.over || G.finishing || G.matched.has(w.en)){ speak(textOf(w,tar()), side==='L' && G.mask); flashPop(el); return; }
  if(lang===tar()) speak(textOf(w,tar()), side==='L' && G.mask);
  if(G.sel && G.sel.side!==side){
    const lw = side==='L' ? w : G.sel.w, rw = side==='R' ? w : G.sel.w;
    clearSel(); attempt(lw, rw); return;
  }
  if(G.sel && G.sel.w===w){ clearSel(); return; }
  clearSel(); G.sel={side, w}; el.classList.add('sel'); sfx.select();
}
function flashPop(el){ el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
function shake(el){ el.classList.remove('bad'); void el.offsetWidth; el.classList.add('bad'); setTimeout(()=>el.classList.remove('bad'),650); }


function attempt(lw, rw){
  const L=LEVELS[G.level];
  const lEl=elL(lw), rEl=elR(rw);
  if(lw===rw){
    G.combo++; G.streak++; G.maxCombo=Math.max(G.maxCombo,G.combo);
    const cm=comboMult(G.combo), pts=Math.round(10*cm*L.mult);
    G.listScore+=pts;
    const color=LINE_COLORS[(G.colorBase+G.matched.size)%LINE_COLORS.length];
    G.matched.set(lw.en, color);
    reveal(lw);
    for(const el of [lEl,rEl]){
      el.classList.add('done'); el.style.setProperty('--c',color); el.style.setProperty('--tc', DARK_TEXT.has(color)?'#000':'#fff');
      flashPop(el);
    }
    drawPair(lw, color, true);
    floatText(rEl, '+'+pts, cm>1?'big':'');
    sfx.good(G.combo);
    if(cm>1 && G.combo%3===0) bumpCombo();
    const s=stat(lw.en); s.n++; s.t=Date.now();
    if(!G.wrongWords.has(lw.en) && !G.hinted.has(lw.en)){ s.ok++; s.st++; s.w=Math.max(0,s.w-2); }
    if(G.matched.size===G.left.length){
      G.finishing=true; G.endElapsed=elapsed(); stopTimer();
      setTimeout(()=>finishList(false), 550);
    }
  } else {
    // l'erreur est comptée pour le mot de gauche : celui qu'il fallait traduire
    G.errors++; G.combo=0; G.streak=0;
    const s=stat(lw.en); s.err++; s.st=0; s.w=Math.min(12,s.w+3); s.t=Date.now();
    G.wrongWords.add(lw.en);
    const pen=Math.round(2*L.mult); G.listScore=Math.max(0,G.listScore-pen);
    if(L.penalty){ G.penalty+=L.penalty; floatText(rEl,'−'+L.penalty+' s','bad'); }
    else floatText(rEl,'−'+pen,'bad');
    drawWrong(lw, rw); shake(lEl); shake(rEl); sfx.bad();
  }
  updateBand(); save();
}

/* ---------- indice ---------- */
$('#pHint').addEventListener('click', ()=>{
  if(!G || G.over || G.finishing || G.hints<=0) return;
  let w = G.sel ? G.sel.w : null;
  if(!w){
    const left=G.left.filter(x=>!G.matched.has(x.en)); if(!left.length) return;
    w=left[Math.floor(Math.random()*left.length)];

  }

  G.hints--; G.hinted.add(w.en);
  const L=LEVELS[G.level], cost=Math.round(5*L.mult);
  G.listScore=Math.max(0,G.listScore-cost); floatText(target,'−'+cost,'bad');
  updateBand();
});
$('#pSound').addEventListener('click', ()=>{ S.settings.sound=!S.settings.sound; save(); updateBand(); sfx.select(); });
$('#pQuit').addEventListener('click', ()=>{

});



/* ---------- lignes ---------- */
function anchor(el, side){
  const b=board.getBoundingClientRect(), r=el.getBoundingClientRect();
  return {x:(side==='L' ? r.right+2 : r.left-2)-b.left, y:r.top+r.height/2-b.top};
}
function curveD(a,c){
  const dx=(c.x-a.x)*.55;
  return `M${a.x.toFixed(1)},${a.y.toFixed(1)} C${(a.x+dx).toFixed(1)},${a.y.toFixed(1)} ${(c.x-dx).toFixed(1)},${c.y.toFixed(1)} ${c.x.toFixed(1)},${c.y.toFixed(1)}`;
}
function mkPath(d, attrs){ const p=document.createElementNS(svgNS,'path'); p.setAttribute('d',d); for(const k in attrs) p.setAttribute(k,attrs[k]); return p; }
function drawPair(w, color, animate){
  const d=curveD(anchor(elL(w),'L'), anchor(elR(w),'R'));
  const casing=mkPath(d,{stroke:'#fff','stroke-width':12,fill:'none','stroke-linecap':'round'});
  const line=mkPath(d,{stroke:color,'stroke-width':7,fill:'none','stroke-linecap':'round'});
  linesG.append(casing,line);
  if(animate && !reduced){
    for(const p of [casing,line]){
      const len=p.getTotalLength();
      p.style.strokeDasharray=len; p.style.strokeDashoffset=len;
      p.getBoundingClientRect();
      p.style.transition='stroke-dashoffset .35s ease-out'; p.style.strokeDashoffset=0;
    }
  }
}
function drawMissedLines(){
  for(const w of G.missed){
    linesG.append(mkPath(curveD(anchor(elL(w),'L'), anchor(elR(w),'R')),
      {stroke:'#EE352E','stroke-width':4,fill:'none','stroke-dasharray':'2 9','stroke-linecap':'round'}));
  }
}
function drawLines(){
  if(!G || play.hidden) return;
  linesG.innerHTML='';
  for(const [en] of G.matched) drawPair(EN_INDEX.get(en), G.matched.get(en), false);
  if(G.missed.length) drawMissedLines();
}
function drawWrong(lw, rw){
  const p=mkPath(curveD(anchor(elL(lw),'L'), anchor(elR(rw),'R')),
    {stroke:'#EE352E','stroke-width':5,fill:'none','stroke-dasharray':'12 8','stroke-linecap':'round','marker-end':'url(#arrowRed)'});
  flashG.appendChild(p);
  setTimeout(()=>{ p.style.transition='opacity .3s'; p.style.opacity='0'; }, 650);
  setTimeout(()=>p.remove(), 1000);
}
function floatText(el, text, cls){
  const b=board.getBoundingClientRect(), r=el.getBoundingClientRect();
  const f=document.createElement('div'); f.className='float '+(cls||''); f.textContent=text;
  f.style.left=(r.left-b.left+r.width/2)+'px'; f.style.top=(r.top-b.top+r.height/2)+'px';
  board.appendChild(f); setTimeout(()=>f.remove(),1100);
}
board.addEventListener('pointermove', e=>{
  if(!G || !G.sel || G.over || e.pointerType==='touch'){ rubber.setAttribute('d',''); return; }
  const b=board.getBoundingClientRect(), p={x:e.clientX-b.left, y:e.clientY-b.top};
  const a = G.sel.side==='L' ? anchor(elL(G.sel.w),'L') : anchor(elR(G.sel.w),'R');
  rubber.setAttribute('d', curveD(a,p));
});
board.addEventListener('pointerleave', ()=>rubber.setAttribute('d',''));
if('ResizeObserver' in window) new ResizeObserver(()=>drawLines()).observe(board);
window.addEventListener('resize', drawLines);

/* ---------- chrono ---------- */
let timerId=null;
function elapsed(){ return ((G.pausedAt||performance.now())-G.t0)/1000; }
function startTimer(){ stopTimer(); timerId=setInterval(tickTimer,100); tickTimer(); }
function stopTimer(){ if(timerId) clearInterval(timerId); timerId=null; }
function pause(){ if(G && !G.over && !G.pausedAt) G.pausedAt=performance.now(); }
function resume(){ if(G && G.pausedAt){ G.t0+=performance.now()-G.pausedAt; G.pausedAt=null; } }
function tickTimer(){
  if(!G || G.over || G.finishing || G.pausedAt) return;
  const el=elapsed(), tw=$('#timer'), fill=$('#timerFill'), tb=$('#pTime'), rem=$('#pLeft');
  tb.textContent=fmt(Math.floor(el));
  tb.classList.toggle('slow', G.avgBefore!=null && el>G.avgBefore);
  if(G.time>0){
    const left=Math.max(0, G.time-el-G.penalty);
    fill.style.width=(left/G.time*100)+'%';
    rem.hidden=false; rem.querySelector('b').textContent=fmt(Math.ceil(left));
    const low=left<=Math.min(10, G.time/3); tw.classList.toggle('low',low); rem.classList.toggle('low',low); tw.classList.remove('free');
    const s=Math.ceil(left);
    if(low && left>0 && s!==G.lastTick){ G.lastTick=s; sfx.tick(); }
    if(left<=0) finishList(true);
  } else {
    rem.hidden=true; tw.classList.add('free'); tw.classList.remove('low'); fill.style.width='100%';
  }
}
document.addEventListener('visibilitychange', ()=>{
  if(!G || G.over) return;
  if(document.hidden) pause(); else if(modal.hidden) resume();
});

/* ---------- fin de liste ---------- */
function finishList(timeout){
  if(!G || G.over) return;
  const L=LEVELS[G.level], N=G.left.length;
  const el = G.endElapsed!=null ? G.endElapsed : elapsed();
  G.over=true; stopTimer(); clearSel();
  $('#pTime').textContent=fmt(el);
  const left = G.time ? Math.max(0, G.time-el-G.penalty) : 0;
  const unmatched = G.left.filter(w=>!G.matched.has(w.en));
  const now=Date.now();
  for(const w of unmatched){
    const s=stat(w.en); s.n++; s.err++; s.st=0; s.w=Math.min(12,s.w+2); s.t=now; G.wrongWords.add(w.en);
    reveal(w); elL(w).classList.add('missed'); elR(w).classList.add('missed');
  }
  G.missed = unmatched; if(unmatched.length) drawMissedLines();
  const perfect = !timeout && G.errors===0 && G.hinted.size===0;
  const timeBonus = (!timeout && G.time) ? Math.round(left*L.mult) : 0;
  const perfectBonus = perfect ? Math.round(50*L.mult*N/15) : 0;
  G.listScore += timeBonus + perfectBonus;

  // temps : seules les listes terminées comptent dans la moyenne
  let record=false;
  if(!timeout){
    const tt = S.times[N] || (S.times[N]={n:0, sum:0, best:null, last:[]});
    record = tt.best!=null && el<tt.best;
    tt.n++; tt.sum+=el; tt.best = tt.best==null ? el : Math.min(tt.best, el);
    tt.last.push(Math.round(el*10)/10); if(tt.last.length>20) tt.last.shift();
  }
  // activité du jour
  const k=dayKey(), a=S.act[k]||(S.act[k]={l:0,p:0,s:0,w:0});
  a.l++; a.p+=G.listScore; a.s+=Math.round(el); a.w+=G.matched.size;

  const rankBefore = rankOf(S.score);
  S.score += G.listScore; S.lists++;
  S.answered += G.matched.size;
  G.sentenceDue = SENTS.length>0 && Math.floor(S.answered/SENT_EVERY) > S.sentMark;
  S.bestList = Math.max(S.bestList, G.listScore);
  S.bestCombo = Math.max(S.bestCombo, G.maxCombo);
  if(perfect) S.perfect++;
  updateDay();
  G.sessionScore += G.listScore;
  G.sessionOk += G.matched.size; G.sessionBad += G.errors; G.sessionMissed += unmatched.length;
  const stars = timeout ? (G.matched.size>=Math.ceil(N*2/3)?1:0) : (perfect ? 3 : G.errors<=(N>=15?2:1) ? 2 : 1);
  const newBadges = checkBadges({perfect, timeout, el, N});
  const rankUp = rankOf(S.score) > rankBefore;
  save(); updateBand(); scheduleSync(2500);
  $('#pScore').textContent = nf(G.sessionScore);

  if(perfect){ sfx.win(); confetti(); } else if(timeout) sfx.fail(); else sfx.win();
  if(rankUp) setTimeout(()=>{ sfx.rank(); toast('🎉',t('Nouveau rang'), rankName(rankOf(S.score))); }, 800);
  setTimeout(()=>showListModal({timeout, perfect, stars, timeBonus, perfectBonus, el, unmatched, newBadges, record, N}), unmatched.length ? 1300 : 650);
}
function giveBadge(id, got){
  if(S.badges[id]) return;
  S.badges[id]=Date.now(); const b=BADGES.find(b=>b.id===id); if(got) got.push(b); return b;
}
function checkBadges(ctx){
  const got=[];
  const give=id=>giveBadge(id, got);
  give('first');
  if(ctx.perfect) give('perfect');
  if(G.streak>=15) give('combo15');
  if(!ctx.timeout && ctx.el<3*ctx.N) give('fast');
  if(G.mask && ctx.perfect && ctx.N>=10) give('ear');
  if(G.dir==='nt' && !ctx.timeout) give('reverse');
  if(G.mode==='revenge' && ctx.perfect) give('revenge');
  if(G.level===3 && !ctx.timeout) give('expert');
  if(G.total>=10 && G.index>=G.total) give('session10');
  if(S.day.streak>=7) give('streak7');
  const m=counts().mastered; if(m>=100) give('m100'); if(m>=500) give('m500');
  got.forEach((b,i)=>setTimeout(()=>toast(b.ic,t('Badge débloqué'),bName(b)), 300+i*600));
  return got;
}
function showListModal(r){
  const last = G.index>=G.total, N=r.N, due=G.sentenceDue;
  const title = r.perfect ? t('Sans faute !') : r.timeout ? t('Terminus : temps écoulé') : t('Station atteinte');
  const sub = r.perfect ? t('Tous les mots du premier coup.')
    : r.timeout ? t(r.unmatched.length>1 ? '{n} non reliés. Les bonnes liaisons sont tracées en pointillés rouges sur le plan.' : '{n} non relié. Les bonnes liaisons sont tracées en pointillés rouges sur le plan.', {n:plural(r.unmatched.length,'mot')})
    : (G.hinted.size ? t('{e} et {h} sur cette liste.', {e:plural(G.errors,'erreur'), h:plural(G.hinted.size,'indice')}) : t('{e} sur cette liste.', {e:plural(G.errors,'erreur')}));
  const stars=[0,1,2].map(i=>`<span class="star${i<r.stars?' on':''}">★</span>`).join('');
  const bonus=[r.timeBonus?t('Bonus chrono +{n}',{n:r.timeBonus}):'', r.perfectBonus?t('Bonus sans faute +{n}',{n:r.perfectBonus}):''].filter(Boolean).join(', ');
  const avgNow = avgTime(N);
  let verdict='', vcls='';
  if(r.timeout){ verdict=t('Liste non terminée : ce temps ne compte pas dans ta moyenne.'); vcls='meh'; }
  else if(G.bestBefore==null){ verdict=t('Premier temps enregistré pour une liste de {n} mots.',{n:N}); vcls='good'; }
  else if(r.record){ verdict=t('Nouveau record pour une liste de {n} mots ! L’ancien était {x}.',{n:N, x:fmt(G.bestBefore)}); vcls='good'; }
  else if(G.avgBefore!=null){
    const d=Math.round(Math.abs(r.el-G.avgBefore));
    if(r.el<=G.avgBefore){ verdict = d ? t('{n} s de mieux que ta moyenne.',{n:d}) : t('Pile dans ta moyenne.'); vcls='good'; }
    else { verdict=t('{n} s de plus que ta moyenne.',{n:d}); vcls='meh'; }
  }
  const review=[...G.wrongWords].map(en=>EN_INDEX.get(en));
  const next = due
    ? `<button class="cta" data-action="${last?'summary':'next'}" data-autofocus>${t('Traduire la phrase')}</button>`
    : last
    ? `<button class="cta" data-action="summary" data-autofocus>${G.total>1?t('Voir le bilan du trajet'):t('Terminer')}</button>`
    : `<button class="cta" data-action="next" data-autofocus>${t('Liste suivante ({i} / {n})',{i:G.index+1, n:G.total})}</button>`;
  openModal(`
    <h2 class="m-title">${title}</h2>
    <div class="stars" aria-label="${t('{n} étoile(s) sur 3',{n:r.stars})}">${stars}</div>
    <p class="m-sub">${sub}</p>
    <dl class="m-grid">
      <div><dt>${t('Temps')}</dt><dd>${fmt(r.el)}<small>${avgNow!=null?t('moyenne {x}',{x:fmt(avgNow)}):t('pas encore de moyenne')}</small></dd></div>
      <div><dt>${t('Points')}</dt><dd>+${nf(G.listScore)}</dd></div>
      <div><dt>${t('Meilleure série')}</dt><dd>${G.maxCombo}</dd></div>
      <div><dt>${t('Erreurs')}</dt><dd>${G.errors}</dd></div>
    </dl>
    ${verdict?`<p class="verdict ${vcls}">${verdict}</p>`:''}
    ${bonus?`<p class="bonus">${bonus}</p>`:''}
    ${due?`<p class="verdict good">🎫 ${t('Tu as relié {n} mots : une phrase à traduire t’attend avant la suite.',{n:SENT_EVERY*Math.floor(S.answered/SENT_EVERY)})}</p>`:''}
    ${r.newBadges.length?`<h3>${r.newBadges.length>1?t('Badges débloqués'):t('Badge débloqué')}</h3><div class="newbadges">${r.newBadges.map(b=>`<span class="chip">${b.ic} ${esc(bName(b))}</span>`).join('')}</div>`:''}
    ${review.length?`<h3>${t('À revoir (ces mots reviendront plus souvent)')}</h3><ul class="review">${review.map(w=>`<li><button class="say" data-action="say" data-word="${esc(textOf(w,tar()))}">🔊 ${esc(textOf(w,tar()))}</button><span>${esc(textOf(w,LANG))}</span></li>`).join('')}</ul>`:''}
    <div class="m-actions">${next}<button class="ghost" data-action="peek">${t('Voir le plan')}</button><button class="ghost" data-action="home">${t('Accueil')}</button></div>`);
}
function showSummary(){
  const tot=G.sessionOk+G.sessionBad+G.sessionMissed;
  const acc = tot ? Math.round(100*G.sessionOk/tot) : 0;
  const r=rankOf(S.score), next=RANK_PTS[r+1];

    <dl class="m-grid">
      <div><dt>${t('Points du trajet')}</dt><dd>${nf(G.sessionScore)}</dd></div>
      <div><dt>${t('Précision')}</dt><dd>${acc} %</dd></div>
      <div><dt>${t('Mots reliés')}</dt><dd>${G.sessionOk}</dd></div>

}
function goHome(){ closeModal(); stopTimer(); G=null; if(TTS) speechSynthesis.cancel(); show('home'); }
// après une liste : une éventuelle phrase à traduire, puis la suite
function afterList(kind){
  const go = ()=>{ if(kind==='next') nextList(); else if(G && G.total>1) showSummary(); else goHome(); };
  if(G && G.sentenceDue && SENTS.length){
    G.sentenceDue=false; S.sentMark=Math.floor(S.answered/SENT_EVERY); save();
    startSentence({after:go});
  } else go();
}


/* =========================================================
   Fenêtre modale
   ========================================================= */
const modal=$('#modal'), sheet=$('#sheet');
let peekBtn=null;
function openModal(html){
  sheet.innerHTML=html; modal.hidden=false;
  const f=sheet.querySelector('[data-autofocus]')||sheet.querySelector('button'); if(f) f.focus();
}
function closeModal(){ modal.hidden=true; sheet.innerHTML=''; if(peekBtn){ peekBtn.remove(); peekBtn=null; } }
sheet.addEventListener('click', e=>{
  const b=e.target.closest('[data-action]'); if(!b) return;
  const a=b.dataset.action;
  if(a==='say'){ speak(b.dataset.word, true); return; }
  if(a==='next'){ afterList('next'); return; }
  if(a==='summary'){ afterList('summary'); return; }
  if(a==='replay'){ closeModal(); const m=G.mode; startSession(m==='revenge'&&!weakWords().length?'normal':m); return; }
  if(a==='home'){ goHome(); return; }
  if(a==='resume'){ closeModal(); resume(); return; }
  if(a==='close'){ closeModal(); if(!home.hidden) renderHome(); if(!statsSec.hidden) renderStats(); return; }
  if(a==='peek'){ peekBoard(); return; }
  if(a==='pinOk'){ checkPin(); return; }
  if(a==='testVoice'){ speak(sampleText(), true); return; }
  if(a==='profileOk'){ saveProfile(); return; }
  if(a==='reset'){ const keep=P.data.settings, ep=(P.data.epoch||0)+1; P.data=defaults(); P.data.settings=keep; P.data.epoch=ep; S=P.data; save(); closeModal(); show('home'); toast('🧹',t('Progression effacée'),t('Nouveau départ')); scheduleSync(800); return; }
  if(a==='delete' || a==='deleteBoth'){
    const name=P.name, id=P.id, both=a==='deleteBoth';
    delete DB.players[id]; setPlayer(null); closeModal(); show('players'); toast('👋',t('Joueur supprimé'), name);
    if(both && ghReady()) ghDeletePlayer(id).then(()=>toast('☁',t('GitHub'),t('Profil supprimé sur GitHub'))).catch(err=>toast('⚠',t('GitHub'),errText(err)));
    return;
  }
  if(a==='ghSave'){ ghSaveForm(false); return; }
  if(a==='ghTest'){ ghSaveForm(true); return; }
  if(a==='ghSync'){ ghSyncFromModal(); return; }
  if(a==='ghOff'){ DB.gh=null; saveDB(); closeModal(); updateCloudBtn(); toast('☁',t('GitHub'),t('Connexion supprimée de cet ordinateur')); return; }
  if(a==='ghOpenRank'){ closeModal(); rankFrom=P?'home':'players'; show('rank'); return; }
});

/* ---------- graphique d'activité ---------- */
function activitySeries(){
  const out=[], today=new Date(); today.setHours(0,0,0,0);
  if(actPeriod!=='year'){
    const n = actPeriod==='week' ? 7 : 30;
    for(let i=n-1;i>=0;i--){
      const d=new Date(today); d.setDate(d.getDate()-i);
      const wd=fmtDate(d,{weekday:'short'});
      out.push({label: actPeriod==='week' ? wd+' '+d.getDate() : String(d.getDate()),
        full: fmtDate(d,{weekday:'long', day:'numeric', month:'long'}), a:S.act[dayKey(d)]||null});
    }
  } else {
    for(let i=11;i>=0;i--){
      const d=new Date(today.getFullYear(), today.getMonth()-i, 1);
      const prefix=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-';
      let a=null;
      for(const k in S.act){ if(k.startsWith(prefix)){ const x=S.act[k]; a=a||{l:0,p:0,s:0,w:0}; a.l+=x.l; a.p+=x.p; a.s+=x.s; a.w+=x.w; } }
      out.push({label:fmtDate(d,{month:'short'}), full:fmtDate(d,{month:'long', year:'numeric'}), a});
    }
  }
  for(const o of out) o.v = !o.a ? 0 : actMetric==='lists' ? o.a.l : actMetric==='minutes' ? Math.round(o.a.s/6)/10 : o.a.p;
  return out;
}
function niceMax(v){
  if(v<=0) return actMetric==='lists' ? 2 : 1;
  const e=Math.pow(10,Math.floor(Math.log10(v)));
  for(const m of [1,2,4,5,10]){ if(m*e>=v) return m*e; }
  return 10*e;
}
function fmtVal(v){ return actMetric==='minutes' ? v.toLocaleString(locale(),{maximumFractionDigits:1}).replace(/ /g,' ') : nf(v); }
function unitOf(v){ return actMetric==='lists' ? t(v>1?'listes':'liste') : actMetric==='minutes' ? 'min' : t('points'); }
function tipText(o){
  if(!o.a) return `<b>${esc(o.full)}</b>${t('Pas de jeu')}`;
  return `<b>${esc(o.full)}</b>${plural(o.a.l,'liste')}, ${fmtDur(o.a.s)}<br>${t('{p} points, {w} mots reliés',{p:nf(o.a.p), w:o.a.w})}`;
}
function roundTop(x,y,w,h,r){ return `M${x},${y+h} L${x},${y+r} Q${x},${y} ${x+r},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h} Z`; }
function renderActivity(){
  const box=$('#actBox'); if(!box) return;
  statsSec.querySelectorAll('#actPeriod [data-p]').forEach(b=>b.setAttribute('aria-checked', b.dataset.p===actPeriod));
  statsSec.querySelectorAll('#actMetric [data-m]').forEach(b=>b.setAttribute('aria-checked', b.dataset.m===actMetric));
  const data=activitySeries();
  const tot=data.reduce((tt,o)=>{ if(o.a){ tt.l+=o.a.l; tt.p+=o.a.p; tt.s+=o.a.s; tt.w+=o.a.w; } return tt; },{l:0,p:0,s:0,w:0});
  const per={week:t('Sur les 7 derniers jours'), month:t('Sur les 30 derniers jours'), year:t('Sur les 12 derniers mois')}[actPeriod];
  const active=data.filter(o=>o.a).length;
  $('#actSum').innerHTML = tot.l
    ? t('{per} : {lists}, {dur} de jeu, {pts} points, {w} mots reliés, {act} d’activité.', {per, lists:'<b>'+plural(tot.l,'liste')+'</b>', dur:fmtDur(tot.s), pts:nf(tot.p), w:tot.w, act:plural(active, 'jour')})
    : t('{per} : pas encore de partie. Lance une liste pour voir ta courbe grimper.', {per});
  if(tot.l && actPeriod==='year') $('#actSum').innerHTML = t('{per} : {lists}, {dur} de jeu, {pts} points, {w} mots reliés, {act} d’activité.', {per, lists:'<b>'+plural(tot.l,'liste')+'</b>', dur:fmtDur(tot.s), pts:nf(tot.p), w:tot.w, act:plural(active,'mois','=')});

  const max=Math.max(0, ...data.map(d=>d.v)), top=niceMax(max);
  const W=Math.max(300, box.clientWidth-24), H=240, padL=16+7.5*fmtVal(top).length, padR=8, padT=24, padB=30;
  const pw=W-padL-padR, ph=H-padT-padB, n=data.length;
  const band=pw/n, bw=Math.max(4, Math.min(46, band*0.72));
  const Y=v=>padT+ph-(v/top)*ph;
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('Activité : {u} par {p}',{u:unitOf(2), p:actPeriod==='year'?t('mois'):t('jour')})}">`;
  for(const g of [top/2, top]) s+=`<line x1="${padL}" x2="${W-padR}" y1="${Y(g)}" y2="${Y(g)}" stroke="#e3e5df" stroke-width="1"/><text class="ax" x="${padL-8}" y="${Y(g)+4}" text-anchor="end">${fmtVal(g)}</text>`;
  s+=`<text class="ax" x="${padL-8}" y="${Y(0)+4}" text-anchor="end">0</text>`;
  const step = actPeriod==='month' ? 5 : 1;
  data.forEach((d,i)=>{
    const x=padL+band*i+(band-bw)/2, h=(d.v/top)*ph;
    if(h>0) s+=`<path d="${roundTop(x, Y(d.v), bw, h, Math.min(4, bw/2, h))}" fill="#0039A6"/>`;
    if((n-1-i)%step===0) s+=`<text class="ax${i===n-1?' today':''}" x="${x+bw/2}" y="${H-10}" text-anchor="middle">${esc(d.label)}</text>`;
  });
  s+=`<line x1="${padL}" x2="${W-padR}" y1="${Y(0)}" y2="${Y(0)}" stroke="#000" stroke-width="1.5"/>`;
  if(max>0){ const i=data.findIndex(d=>d.v===max); const x=padL+band*i+band/2; s+=`<text class="val" x="${x}" y="${Y(max)-7}" text-anchor="middle">${fmtVal(max)}</text>`; }
  data.forEach((d,i)=>{ s+=`<rect class="hit" data-i="${i}" x="${padL+band*i}" y="${padT}" width="${band}" height="${ph}" fill="transparent"/>`; });
  s+='</svg><div class="tipbox" hidden></div>';
  box.innerHTML=s;
  const tip=box.querySelector('.tipbox');
  const showTip=(r)=>{ const i=+r.dataset.i, d=data[i]; tip.innerHTML=tipText(d); tip.hidden=false;

/* =========================================================
   Petits plaisirs : toasts et confettis
