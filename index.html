function toast(ic, title, text){
  const t=document.createElement('div'); t.className='toast';
  t.innerHTML=`<span class="t-ic">${ic}</span><div><b>${esc(title)}</b><span>${esc(text)}</span></div>`;
  $('#toasts').appendChild(t);
  setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(),400); }, 3600);
}
function confetti(){
  if(reduced) return;
  const cv=$('#confetti'); cv.hidden=false;
  const dpr=window.devicePixelRatio||1, W=cv.width=innerWidth*dpr, H=cv.height=innerHeight*dpr, ctx=cv.getContext('2d');
  const parts=Array.from({length:170},()=>({x:W/2+(Math.random()-.5)*W*.3, y:H*.35, vx:(Math.random()-.5)*16*dpr, vy:(-Math.random()*16-4)*dpr,
    s:(5+Math.random()*7)*dpr, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:LINE_COLORS[Math.floor(Math.random()*LINE_COLORS.length)], round:Math.random()<.4}));
  const t0=performance.now();
  (function frame(t){
    ctx.clearRect(0,0,W,H);
    for(const p of parts){ p.vy+=.45*dpr; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c;
      if(p.round){ ctx.beginPath(); ctx.arc(0,0,p.s/2,0,7); ctx.fill(); } else ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
      ctx.restore(); }
    if(t-t0<2800) requestAnimationFrame(frame); else { ctx.clearRect(0,0,W,H); cv.hidden=true; }
  })(t0);
}

/* =========================================================
   Phrases à traduire : une phrase tous les 75 mots reliés.
   La phrase est affichée dans une langue ; sous le plan, les mots de l'autre
   langue, mélangés à des intrus. On les touche dans l'ordre pour construire la traduction.
   ========================================================= */
function tokSent(s){
  s=s.trim(); const m=/\s*([.?!…])$/.exec(s); const end=m?m[1]:''; if(m) s=s.slice(0,m.index);
  const tokens=s.split(/\s+/).map((w,i)=>{
    if(w[0]==='~') return w.slice(1);                              // nom propre en début de phrase
    if(i===0 && !/^I(['’]|$)/.test(w)) return w.charAt(0).toLowerCase()+w.slice(1);
    return w;
  });
  return {tokens, end};
}
function sentText(o, lang){
  let s=o.tokens.join(' '); s=s.charAt(0).toUpperCase()+s.slice(1);
  return s+(o.end ? ((lang==='fr' && /[?!]/.test(o.end))?' ':'')+o.end : '');
}
const SENTS = RAWS.map(p=>{ const en=tokSent(p[0]), fr=tokSent(p[1]); return {en, fr, len:Math.max(en.tokens.length, fr.tokens.length)}; });
const POOL = {en:null, fr:null};
function wordPool(lang){
  if(!POOL[lang]){
    const s=new Set(); SENTS.forEach(x=>x[lang].tokens.forEach(w=>s.add(w)));
    WORDS.forEach(w=>{ const v=textOf(w,lang).toLowerCase(); if(!/\s/.test(v) && v.length>1) s.add(v); });
    POOL[lang]=[...s];
  }
  return POOL[lang];
}
function adjOf(l){ return LANG==='fr' ? (l==='en'?'anglais':'français') : (l==='en'?'English':'French'); }

let X = null;     // exercice de phrase en cours
function pickSentenceIdx(){
  const maxLen=[7,10,99,99][S.settings.level];
  let idx=SENTS.map((_,i)=>i).filter(i=>SENTS[i].len<=maxLen);
  if(!idx.length) idx=SENTS.map((_,i)=>i);
  const unseen=idx.filter(i=>!S.sseen[i]);
  if(unseen.length) return unseen[Math.floor(Math.random()*unseen.length)];
  // toutes vues : celles qui ont déjà fait des erreurs reviennent plus souvent
  return weightedPick(idx, i=>{ const s=S.sseen[i]||{n:0,err:0}; return 1+3*s.err/(1+s.n); }, 1)[0];
}
function startSentence(ctx){
  if(!SENTS.length){ if(ctx.after) ctx.after(); return; }
  const i=pickSentenceIdx();
  let d=S.settings.sdir; if(d!=='tn' && d!=='nt') d=Math.random()<.5?'tn':'nt';
  const srcLang = d==='tn' ? tar() : LANG, ansLang = d==='tn' ? LANG : tar();
  const src=SENTS[i][srcLang], ans=SENTS[i][ansLang];
  const k=Math.max(3, Math.min(5, Math.round(ans.tokens.length*0.6)));
  const have=new Set(ans.tokens.map(w=>w.toLowerCase()));
  const dis=[], seen=new Set();
  for(const w of shuffle(wordPool(ansLang).slice())){
    const lw=w.toLowerCase(); if(have.has(lw) || seen.has(lw)) continue;
    seen.add(lw); dis.push(w); if(dis.length>=k) break;
  }
  const bank=shuffle(ans.tokens.concat(dis)).map((w,j)=>({id:j, w}));
  X={i, d, srcLang, ansLang, src, ans, bank, placed:[], errors:0, hints:0, over:false, ctx, marks:null};
  renderSentence();
  if(srcLang===tar()) speak(sentText(src,srcLang));
}
function bankWord(id){ return X.bank.find(b=>b.id===id).w; }
function renderSentence(){
  const x=X, L=LEVELS[S.settings.level]; setLevelColor(L);
  openModal(`
    <h2 class="m-title">${t('Phrase à traduire')}</h2>
    <p class="m-sub">${x.ctx.practice ? t('Entraînement : touche les mots dans le bon ordre.') : t('Station spéciale : touche les mots dans le bon ordre. Attention aux intrus !')}</p>
    <div class="sent-src">${x.srcLang===tar()?`<button class="say" id="sSay" aria-label="${t('Écouter la phrase')}">🔊</button>`:''}<p class="sent-text" lang="${x.srcLang}">${esc(sentText(x.src,x.srcLang))}</p></div>
    <p class="sent-lab">${t('Construis la traduction en {lang}. Certains mots sont des intrus.',{lang:adjOf(x.ansLang)})}</p>
    <div class="slots" id="sSlots" aria-label="${t('Ta traduction')}"></div>
    <div class="bank" id="sBank" aria-label="${t('Mots disponibles')}"></div>
    <p class="err" id="sMsg" role="alert"></p>
    <div class="m-actions">
      <button class="cta" id="sCheck" disabled>${t('Vérifier')}</button>
      <button class="ghost" id="sHint">💡 ${t('Indice')} (−8)</button>
      <button class="ghost" id="sSkip">${t('Voir la réponse')}</button>
      ${x.ctx.practice?`<button class="ghost" id="sClose">${t('Fermer')}</button>`:''}
    </div>`);
  const slots=$('#sSlots'), bank=$('#sBank');
  bank.addEventListener('click', e=>{
    const b=e.target.closest('[data-b]'); if(!b || x.over) return;
    const id=+b.dataset.b; if(x.placed.includes(id) || x.placed.length>=x.ans.tokens.length) return;
    x.placed.push(id); x.marks=null; $('#sMsg').textContent='';
    if(x.ansLang===tar()) speak(bankWord(id));
    sfx.select(); paintSentence();
  });
  slots.addEventListener('click', e=>{
    const b=e.target.closest('[data-pl]'); if(!b || x.over) return;
    x.placed.splice(+b.dataset.pl,1); x.marks=null; $('#sMsg').textContent=''; sfx.select(); paintSentence();
  });
  $('#sCheck').onclick=sentCheck;
  $('#sHint').onclick=sentHint;
  $('#sSkip').onclick=()=>sentEnd(false);
  if($('#sSay')) $('#sSay').onclick=()=>speak(sentText(x.src,x.srcLang), true);
  if($('#sClose')) $('#sClose').onclick=()=>{ const c=x.ctx; X=null; if(TTS) speechSynthesis.cancel(); if(c.after) c.after(); };
  paintSentence();
}
function paintSentence(){
  const x=X, N=x.ans.tokens.length;
  let s=x.placed.map((id,pos)=>`<button class="chipw${x.marks?(x.marks[pos]?' ok':' no'):''}" data-pl="${pos}" lang="${x.ansLang}">${esc(bankWord(id))}</button>`).join('');
  for(let i=x.placed.length;i<N;i++) s+='<span class="slot"></span>';
  $('#sSlots').innerHTML=s;
  $('#sBank').innerHTML=x.bank.map(b=>{ const used=x.placed.includes(b.id);
    return `<button class="chipw${used?' used':''}" data-b="${b.id}" lang="${x.ansLang}" ${used?'disabled aria-hidden="true"':''}>${esc(b.w)}</button>`; }).join('');
  $('#sCheck').disabled = x.placed.length!==N;
  $('#sHint').disabled = x.over;
}
function sentCheck(){
  const x=X; if(!x || x.over || x.placed.length!==x.ans.tokens.length) return;
  const marks=x.placed.map((id,i)=>bankWord(id)===x.ans.tokens[i]);
  if(marks.every(Boolean)){ sentEnd(true); return; }
  x.errors++; x.marks=marks; sfx.bad(); paintSentence();
  const k=marks.filter(m=>!m).length;
  $('#sMsg').textContent = t(k>1 ? '{n} mots mal placés. Touche un mot pour le retirer.' : '{n} mot mal placé. Touche un mot pour le retirer.', {n:k});
}
function sentHint(){
  const x=X; if(!x || x.over) return;
  let pos=0; while(pos<x.placed.length && bankWord(x.placed[pos])===x.ans.tokens[pos]) pos++;
  if(pos>=x.ans.tokens.length) return;
  x.placed.length=pos;
  const b=x.bank.find(b=>b.w===x.ans.tokens[pos] && !x.placed.includes(b.id));
  if(b) x.placed.push(b.id);
  x.hints++; x.marks=null; $('#sMsg').textContent=''; sfx.select(); paintSentence();
}
function sentEnd(win){
  const x=X; if(!x || x.over) return;
  x.over=true; if(TTS) speechSynthesis.cancel();
  const L=LEVELS[S.settings.level], N=x.ans.tokens.length;
  const perfect = win && x.errors===0 && x.hints===0;
  let pts=0; const newBadges=[];
  const ss=S.sseen[x.i]||(S.sseen[x.i]={n:0, err:0}); ss.n++; ss.err+=x.errors+(win?0:1);
  S.sent.done++; S.sent.err+=x.errors;
  const rankBefore=rankOf(S.score);
  if(win){
    const base=Math.max(10, 10*N + (perfect?25:0) - 12*x.errors - 8*x.hints);
    pts=Math.round(base*L.mult);
    S.score+=pts; S.sent.ok++; if(perfect) S.sent.perfect++;
    const k=dayKey(), a=S.act[k]||(S.act[k]={l:0,p:0,s:0,w:0}); a.p+=pts;
    updateDay();
    giveBadge('sent1', newBadges); if(S.sent.ok>=10) giveBadge('sent10', newBadges);
    sfx.win(); if(perfect) confetti();
    if(rankOf(S.score)>rankBefore) setTimeout(()=>{ sfx.rank(); toast('🎉',t('Nouveau rang'), rankName(rankOf(S.score))); }, 700);
    newBadges.forEach((b,i)=>setTimeout(()=>toast(b.ic,t('Badge débloqué'),bName(b)), 300+i*600));
  } else { S.sent.skip++; sfx.fail(); }
  save(); scheduleSync(2500);
  // phrase complète dans la langue apprise, prononcée à la fin
  const tg=SENTS[x.i][tar()], nt=SENTS[x.i][LANG];
  const full=x.ans.tokens.map(w=>`<span class="chipw final" lang="${x.ansLang}">${esc(w)}</span>`).join('');
  openModal(`
    <h2 class="m-title">${win ? (perfect ? t('Sans faute !') : t('Bien joué !')) : t('Voici la réponse')}</h2>
    <p class="m-sub">${win ? t('+{n} points', {n:nf(pts)}) + (x.errors||x.hints ? ' · '+[x.errors?plural(x.errors,'erreur'):'', x.hints?plural(x.hints,'indice'):''].filter(Boolean).join(', ') : '') : t('Cette phrase reviendra plus tard.')}</p>
    <div class="slots">${full}</div>
    <div class="sent-ref"><b lang="${tar()}">${esc(sentText(tg,tar()))}</b><span lang="${LANG}">${esc(sentText(nt,LANG))}</span></div>
    <div class="m-actions"><button class="cta" id="sNext" data-autofocus>${t('Continuer')}</button><button class="ghost" id="sSay2">🔊 ${t('Écouter')}</button></div>`);
  $('#sSay2').onclick=()=>speak(sentText(tg,tar()), true);
  $('#sNext').onclick=()=>{ const c=x.ctx; X=null; if(TTS) speechSynthesis.cancel(); if(c.after) c.after(); };
  if(win) speak(sentText(tg,tar()));
}
document.addEventListener('keydown', e=>{
  if(!X || X.over || modal.hidden) return;
  if(e.key==='Backspace' && X.placed.length && document.activeElement.tagName!=='INPUT'){ e.preventDefault(); X.placed.pop(); X.marks=null; $('#sMsg').textContent=''; paintSentence(); }
  else if(e.key==='Enter' && X.placed.length===X.ans.tokens.length && document.activeElement.tagName!=='BUTTON'){ e.preventDefault(); sentCheck(); }
});


/* =========================================================
   Sauvegarde GitHub (API « Contents ») et classement
   Dépôt : {dossier}/joueurs/{id}.json  = profil complet d'un joueur
           {dossier}/classement.json    = résumé de chaque joueur, pour le classement
   ========================================================= */
const GH = {rank:null, state:'off', at:0, msg:'', busy:false, again:false, p:null, timer:null, warned:false};
/* Réglages proposés d’office (rien de secret : le jeton n’est jamais inclus) */
const GH_DEFAULT={owner:'gerojafka', repo:'scores-anglais'};
function ghReady(){ const c=DB.gh; return !!(c && c.token && c.owner && c.repo); }
function ghDir(){ return ((DB.gh && DB.gh.dir) || 'donnees-anglais').replace(/^\/+|\/+$/g,''); }
function errText(e){ return (e && e.message) || String(e); }
function ghErr(status){
  const m = status===0 ? t('Pas de connexion à GitHub (ou accès bloqué par le navigateur).')+(location.protocol!=='file:' ? ' '+t('Depuis une page en ligne, GitHub est souvent bloqué : ouvre le fichier .html sur ton ordinateur.') : '')
    : status===401 ? t('Jeton refusé : il est invalide ou expiré.')
    : status===403 ? t('Accès refusé : le jeton n’a pas le droit « Contents : lecture et écriture » sur ce dépôt, ou la limite GitHub est atteinte.')
    : status===404 ? t('Dépôt introuvable, ou jeton sans accès à ce dépôt.')
    : status===-1 ? t('Fichier illisible sur GitHub.')
    : t('GitHub a répondu : erreur {n}.', {n:status});
  const e=new Error(m); e.status=status; return e;
}
function b64enc(str){
  const bytes=new TextEncoder().encode(str); let bin='';
  for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000));
  return btoa(bin);
}
function b64dec(b64){
  const bin=atob(String(b64).replace(/\s/g,'')), bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
async function ghReq(method, path, body){
  const c=DB.gh;
  const url='https://api.github.com/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo)+(path?'/'+path:'');
  const headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+c.token};
  if(body) headers['Content-Type']='application/json';
  let r;
  try{ r=await fetch(url,{method, cache:'no-store', headers, body: body?JSON.stringify(body):undefined}); }
  catch(e){ throw ghErr(0); }
  let j=null; try{ j=await r.json(); }catch(e){}
  return {status:r.status, ok:r.ok, json:j};
}
function ghPath(p){
  return 'contents/'+ghDir().split('/').map(encodeURIComponent).join('/')+'/'+p.split('/').map(encodeURIComponent).join('/');
}
async function ghGet(p){
  const q = DB.gh.branch ? '?ref='+encodeURIComponent(DB.gh.branch) : '';
  const r=await ghReq('GET', ghPath(p)+q);
  if(r.status===404) return null;
  if(!r.ok) throw ghErr(r.status);
  let obj=null; try{ obj=JSON.parse(b64dec(r.json.content)); }catch(e){ throw ghErr(-1); }
  return {sha:r.json.sha, obj};
}
async function ghPut(p, obj, sha, msg){
  const body={message:msg, content:b64enc(JSON.stringify(obj))};
  if(sha) body.sha=sha; if(DB.gh.branch) body.branch=DB.gh.branch;
  const r=await ghReq('PUT', ghPath(p), body);
  if(r.status===409 || r.status===422){ const e=ghErr(409); e.conflict=true; throw e; }
  if(!r.ok) throw ghErr(r.status);
}
async function withRetry(fn){
  for(let i=0;;i++){
    try{ return await fn(); }
    catch(e){ if(!(e && e.conflict) || i>=4) throw e; await new Promise(r=>setTimeout(r, 250*(i+1))); }
  }
}
// ajoute ou retire des joueurs du classement, en relisant le fichier si quelqu'un l'a modifié entre-temps
async function ghUpdateRanking(mut){
  return withRetry(async()=>{
    const cur=await ghGet('classement.json');
    const rk=(cur && cur.obj && cur.obj.players) ? cur.obj : {v:1, players:{}};
    mut(rk); rk.updated=Date.now();
    await ghPut('classement.json', rk, cur?cur.sha:null, 'Classement');
    return rk;
  });
}
async function ghLoadRanking(){
  const cur=await ghGet('classement.json');
  GH.rank = (cur && cur.obj && cur.obj.players) ? cur.obj : {v:1, players:{}};
  return GH.rank;
}
function summary(p){
  const d=p.data, c=counts(d), act={}, cut=new Date(); cut.setDate(cut.getDate()-370); const ck=dayKey(cut);
  for(const k in d.act) if(k>=ck && d.act[k].p) act[k]=d.act[k].p;
  return {id:p.id, name:p.name, color:p.color, lang:p.lang, score:d.score, lists:d.lists, mastered:c.mastered, seen:c.seen,
    sent:d.sent.ok, streak:currentStreak(d), upd:Date.now(), act};
}
// fusion : on ne perd jamais de progression. Pour chaque mot, l'enregistrement le plus avancé l'emporte.
// Une remise à zéro (epoch plus grand) l'emporte sur tout le reste.
function mergeInto(L, Rraw){
  const R=normalize(Rraw), le=L.epoch||0, re=R.epoch||0;
  if(re>le){ const keep=L.settings; Object.keys(L).forEach(k=>delete L[k]); Object.assign(L, R); L.settings=keep; return; }
  if(re<le) return;
  for(const k in R.stats){ const a=L.stats[k], b=R.stats[k];
    if(!a || (b.n||0)>(a.n||0) || ((b.n||0)===(a.n||0) && (b.t||0)>(a.t||0))) L.stats[k]=b; }
  for(const f of ['score','lists','bestList','bestCombo','perfect','answered','sentMark']) L[f]=Math.max(L[f]||0, R[f]||0);
  for(const f in R.sent) L.sent[f]=Math.max(L.sent[f]||0, R.sent[f]||0);
  for(const k in R.sseen){ const a=L.sseen[k], b=R.sseen[k]; if(!a || b.n>a.n) L.sseen[k]=b; }
  if((R.day.last||'')>(L.day.last||'') || (R.day.last===L.day.last && R.day.streak>L.day.streak)) L.day=Object.assign({}, R.day);
  for(const k in R.badges) if(!L.badges[k] || R.badges[k]<L.badges[k]) L.badges[k]=R.badges[k];
  for(const k in R.act){ const a=L.act[k], b=R.act[k]; if(!a || (b.l+b.p)>(a.l+a.p)) L.act[k]=b; }
  for(const k in R.times){ const a=L.times[k], b=R.times[k]; if(!a || b.n>a.n) L.times[k]=b; }
}
async function syncPlayer(p){
  const path='joueurs/'+p.id+'.json';
  await withRetry(async()=>{
    const cur=await ghGet(path);
    if(cur && cur.obj){
      const o=cur.obj;
      if((o.pu||0)>(p.pu||0)){ p.name=o.name||p.name; p.color=o.color||p.color; p.pin=o.pin||''; p.lang=o.lang==='en'?'en':'fr'; p.pu=o.pu; }
      if(o.data) mergeInto(p.data, o.data);
    }
    const out={v:1, id:p.id, name:p.name, color:p.color, pin:p.pin||'', lang:p.lang, created:p.created, pu:p.pu||0, saved:Date.now(), data:p.data};
    await ghPut(path, out, cur?cur.sha:null, 'Profil de '+p.name);
  });
  return ghUpdateRanking(rk=>{ rk.players[p.id]=summary(p); });
}
function setGh(state, msg){ GH.state=state; GH.msg=msg||''; if(state==='ok') GH.at=Date.now(); updateCloudBtn(); }
function hhmm(ts){ const d=new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function updateCloudBtn(){
  for(const b of [$('#btnCloud'), $('#btnCloudP')]){
    if(!b) continue;
    b.className='bandbtn cloud'+(!ghReady()?'':GH.state==='ok'?' ok':GH.state==='err'?' err':GH.state==='busy'?' busy':'');
    const title = !ghReady() ? t('Sauvegarde GitHub : non configurée')
      : GH.state==='err' ? t('GitHub : {m}',{m:GH.msg}) : GH.state==='busy' ? t('Synchronisation…')
      : GH.at ? t('Synchronisé à {x}',{x:hhmm(GH.at)}) : t('GitHub connecté');
    b.title=title; b.setAttribute('aria-label', title);
  }
}
function scheduleSync(ms){
  if(!ghReady() || !P || DB.gh.auto===false) return;
  clearTimeout(GH.timer); GH.timer=setTimeout(()=>syncNow({silent:true}), ms||2500);
}
function syncNow(o){
  o=o||{};
  if(!ghReady() || !P) return Promise.resolve();
  if(GH.busy){ GH.again=true; return GH.p; }
  GH.busy=true; setGh('busy');
  const p=P;
  GH.p=(async()=>{
    try{
      const rk=await syncPlayer(p);
      GH.rank=rk; saveDB(); setGh('ok'); GH.warned=false;
      if(curScreen==='home' && P===p && modal.hidden) renderHome();
      if(!o.silent) toast('☁', t('GitHub'), t('Sauvegarde envoyée'));
    }catch(e){
      setGh('err', errText(e));
      if(!o.silent || !GH.warned){ GH.warned=true; toast('⚠', t('GitHub'), errText(e)); }
    }finally{
      GH.busy=false;
      if(GH.again){ GH.again=false; scheduleSync(300); }
    }
  })();
  return GH.p;
}
async function ghDeletePlayer(id){
  const cur=await ghGet('joueurs/'+id+'.json');
  if(cur){
    const body={message:'Suppression du profil', sha:cur.sha}; if(DB.gh.branch) body.branch=DB.gh.branch;
    const r=await ghReq('DELETE', ghPath('joueurs/'+id+'.json'), body);
    if(!r.ok && r.status!==404) throw ghErr(r.status);
  }
  await ghUpdateRanking(rk=>{ delete rk.players[id]; });
}
async function importRemote(id){
  try{
    const cur=await ghGet('joueurs/'+id+'.json');
    if(!cur || !cur.obj){ toast('⚠', t('GitHub'), t('Profil introuvable sur GitHub.')); return; }
    const o=cur.obj;
    if(o.pin){
      pendingImport=o; pendingPid=null; setLang(o.lang);
      openModal(`<h2 class="m-title">${t('Code de {name}',{name:esc(o.name)})}</h2>
        <p class="m-sub">${t('Tape ton code à 4 chiffres.')}</p>
        <input class="pinin" id="pinIn" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="${t('Code à 4 chiffres')}" data-autofocus>
        <p class="err" id="pinErr" role="alert"></p>
        <div class="m-actions"><button class="cta" data-action="pinOk">${t('Valider')}</button><button class="ghost" data-action="close">${t('Annuler')}</button></div>`);
      $('#pinIn').addEventListener('keydown', e=>{ if(e.key==='Enter') checkPin(); });
      return;
    }
    finishImport(o);
  }catch(e){ toast('⚠', t('GitHub'), errText(e)); }
}
function finishImport(o){
  let name=o.name||'Joueur';
  while(Object.values(DB.players).some(p=>p.name.toLowerCase()===name.toLowerCase())) name+=' (2)';
  DB.players[o.id]=fixPlayer({id:o.id, name, color:o.color||PLAYER_COLORS[0], pin:o.pin||'', lang:o.lang, created:o.created, pu:o.pu||0, data:o.data});
  setPlayer(o.id); show('home'); toast('☁', t('Profil récupéré'), name);
}

/* ---------- fenêtre de connexion ---------- */

      <div class="two"><label class="field">${t('Compte GitHub')}<input id="ghOwner" value="${esc(c.owner)}" autocomplete="off" placeholder="mon-compte"></label>

      <label class="field">${t('Dossier dans le dépôt')}<input id="ghDir" value="${esc(c.dir||'donnees-anglais')}" autocomplete="off"></label></div>
      <label class="field">${t('Jeton d’accès')}<input id="ghToken" type="password" value="${esc(c.token||'')}" autocomplete="off" placeholder="github_pat_…"></label>
    </div>
    <label class="setrow"><input type="checkbox" id="ghAuto" ${c.auto!==false?'checked':''}> ${t('Synchroniser automatiquement après chaque liste')}</label>
    <p class="ghstat" id="ghStat" role="status"></p>
    <details class="tbl"><summary>${t('Comment obtenir un jeton ?')}</summary><ol class="steps">
      <li>${t('Sur github.com, crée un dépôt privé (les noms et les scores y sont lisibles).')}</li>
      <li>${t('Ouvre Settings, Developer settings, Personal access tokens, Fine-grained tokens, puis Generate new token.')}</li>
      <li>${t('Repository access : Only select repositories, ton dépôt. Permissions : Contents, Read and write.')}</li>
      <li>${t('Copie le jeton et colle-le ici. Il reste sur cet ordinateur, partagé par tous les joueurs qui l’utilisent.')}</li></ol></details>
    <div class="m-actions"><button class="cta" data-action="ghTest" data-autofocus>${t('Tester et enregistrer')}</button>

      <button class="ghost" data-action="ghOpenRank">🏆 ${t('Classement')}</button>
      ${ghReady()?`<button class="ghost danger" data-action="ghOff">${t('Déconnecter')}</button>`:''}
      <button class="ghost" data-action="close">${t('Fermer')}</button></div>`);
}
function ghStatus(msg, cls){ const el=$('#ghStat'); if(el){ el.textContent=msg; el.className='ghstat '+(cls||''); } }
async function ghSaveForm(){
  let owner=$('#ghOwner').value.trim(), repo=$('#ghRepo').value.trim();
  const m=/github\.com\/([^\/\s]+)\/([^\/\s#?]+)/i.exec(owner+' '+repo) || /^([^\/\s]+)\/([^\/\s]+)$/.exec(owner);
  if(m){ owner=m[1]; repo=m[2].replace(/\.git$/,''); }
  const token=$('#ghToken').value.trim();
  if(!owner || !repo || !token){ ghStatus(t('Renseigne le compte, le dépôt et le jeton.'), 'err'); return; }
  const prev=DB.gh;
  DB.gh={owner, repo, branch:$('#ghBranch').value.trim(), dir:($('#ghDir').value.trim()||'donnees-anglais').replace(/^\/+|\/+$/g,''), token, auto:$('#ghAuto').checked};
  ghStatus(t('Test en cours…'));
  try{
    const r=await ghReq('GET','');
    if(!r.ok) throw ghErr(r.status);
    if(r.json && r.json.permissions && r.json.permissions.push===false) throw new Error(t('Le jeton peut lire ce dépôt mais pas y écrire : ajoute la permission « Contents : lecture et écriture ».'));
    saveDB(); GH.state='off'; updateCloudBtn();
    ghStatus(t('Connexion réussie : le dépôt {x} est prêt.',{x:owner+'/'+repo}), 'ok');
    if(P){ await syncNow({silent:true}); if(GH.state==='ok') ghStatus(t('Connexion réussie. Ta sauvegarde est à jour ({x}).',{x:hhmm(GH.at)}), 'ok'); else ghStatus(GH.msg,'err'); }
    else { await ghLoadRanking(); if(curScreen==='players') renderPlayers(); }
  }catch(e){ DB.gh=prev; ghStatus(errText(e), 'err'); updateCloudBtn(); }
}
async function ghSyncFromModal(){
  ghStatus(t('Synchronisation…'));
  await syncNow({silent:true});
  if(GH.state==='ok') ghStatus(t('Ta sauvegarde est à jour ({x}).',{x:hhmm(GH.at)}), 'ok'); else ghStatus(GH.msg, 'err');
}

/* ---------- classement ---------- */
let rankTab='all';
function metricOf(e, tab){
  if(tab==='all') return e.score||0;
  const days = tab==='week' ? 7 : tab==='month' ? 30 : 365;
  const cut=new Date(); cut.setHours(0,0,0,0); cut.setDate(cut.getDate()-(days-1)); const ck=dayKey(cut);
  let s=0; for(const k in (e.act||{})) if(k>=ck) s+=e.act[k]; return s;
}
async function renderRank(){
  const sec=$('#rank');
  sec.innerHTML=`<h2 class="ptitle">${t('Classement')}</h2>
    <p class="lead">${t('Qui a gagné le plus de points ? Choisis la période.')}</p>
    <div class="seg small tabs" id="rkTabs" role="radiogroup" aria-label="${t('Période')}">
      <button role="radio" data-t="week">${t('Semaine')}</button><button role="radio" data-t="month">${t('Mois')}</button><button role="radio" data-t="year">${t('Année')}</button><button role="radio" data-t="all">${t('Total')}</button></div>
    <div id="rkList"><p class="sspin">${t('Chargement…')}</p></div>
    <div class="btnrow" style="margin-top:16px"><button class="ghost" id="rkRefresh">${t('Actualiser')}</button><button class="ghost" id="rkCfg">☁ ${t('Sauvegarde GitHub')}</button></div>
    <p class="note" id="rkNote"></p>`;
  let rk=null, err=null;
  const draw=()=>drawRank(rk, err);
  $('#rkTabs').addEventListener('click', e=>{ const b=e.target.closest('[data-t]'); if(!b) return; rankTab=b.dataset.t; sfx.select(); draw(); });
  $('#rkRefresh').addEventListener('click', ()=>{ sfx.select(); renderRank(); });
  $('#rkCfg').addEventListener('click', openGithub);
  draw();
  if(ghReady()){
    try{
      if(P) await syncNow({silent:true});
      rk = GH.rank && P ? GH.rank : await ghLoadRanking();
      if(GH.state==='err' && P) throw new Error(GH.msg);
    }catch(e){ err=e; }
    if(curScreen==='rank') draw();
  }
}
function drawRank(rk, err){
  const box=$('#rkList'); if(!box) return;
  $('#rkTabs').querySelectorAll('[data-t]').forEach(b=>b.setAttribute('aria-checked', b.dataset.t===rankTab));
  const entries={};
  if(rk) for(const id in rk.players) entries[id]=rk.players[id];
  for(const id in DB.players){ const loc=summary(DB.players[id]); const rem=entries[id]; if(!rem || loc.score>=(rem.score||0)) entries[id]=loc; }
  const list=Object.values(entries).map(e=>({e, v:metricOf(e,rankTab)})).sort((a,b)=>(b.v-a.v)||((b.e.score||0)-(a.e.score||0)));
  const unit={all:t('points au total'), week:t('points sur 7 jours'), month:t('points sur 30 jours'), year:t('points sur 12 mois')}[rankTab];
  box.innerHTML = list.length ? `<ol class="ranking" style="margin-top:14px">${list.map((o,i)=>{ const e=o.e;
    return `<li><div class="rkrow${P&&e.id===P.id?' cur':''}"><span class="pos${i<3?' p'+(i+1):''}">${i+1}</span>
      <span class="avatar" style="${avatarStyle(e.color||'#0039A6')}">${esc(initial(e.name))}</span>
      <span><b>${esc(e.name)}${P&&e.id===P.id?' ('+t('toi')+')':''}</b><small>${esc(rankName(rankOf(e.score||0), e.lang==='en'?'en':'fr'))}. ${e.lang==='en'?t('Apprend le français'):t('Apprend l’anglais')}. ${plural(e.lists||0,'liste jouée','listes jouées')}, ${plural(e.mastered||0,'mot maîtrisé','mots maîtrisés')}, ${plural(e.sent||0,'phrase réussie','phrases réussies')}.</small></span>
      <span class="pscore"><b>${nf(o.v)}</b><small>${unit}</small></span></div></li>`; }).join('')}</ol>`
    : `<p class="note">${t('Aucun joueur pour l’instant.')}</p>`;
  const note=$('#rkNote');
  note.textContent = !ghReady() ? t('Ce classement ne contient que les joueurs de cet ordinateur. Connecte GitHub pour y ajouter ceux des autres ordinateurs.')
    : err ? t('GitHub : {m}',{m:errText(err)})
    : GH.at ? t('Classement synchronisé avec GitHub à {x}.',{x:hhmm(GH.at)}) : '';
}
